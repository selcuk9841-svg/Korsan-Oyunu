<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemi Savunma - AR Destekli Sürüm</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b1d3a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .hud-panel {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00ffcc;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            pointer-events: auto;
            text-shadow: 0 0 5px #00ffcc;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div style="display: flex; justify-content: space-between;">
            <div class="hud-panel" id="wave-info">Bölüm: 1 | Korsan: 0</div>
            <div class="hud-panel" id="health-info">Gemi Sağlığı: %100 | Dost NPC: 3/3</div>
        </div>
        <div id="instructions" class="hud-panel">
            <strong>A / D veya Sol / Sağ Oklar:</strong> Yönü Düzeltildi | <strong>AR Modu:</strong> Aktif
        </div>
    </div>

    <!-- Three.js Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- SAHNE, KAMİRA VE RENDERER ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050b14);
        scene.fog = new THREE.FogExp2(0x050b14, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 25);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- IŞIKLANDIRMA ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffeedd, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- GEMİ VE GÜVERTE (İyileştirilmiş Görseller) ---
        const shipGroup = new THREE.Group();

        // Gövde
        const hullGeo = new THREE.BoxGeometry(12, 4, 30);
        const hullMat = new THREE.MeshStandardMaterial({ color: 0x3b3a36, roughness: 0.4, metalness: 0.8 });
        const hull = new THREE.Mesh(hullGeo, hullMat);
        hull.position.y = -2;
        hull.castShadow = true;
        hull.receiveShadow = true;
        shipGroup.add(hull);

        // Güverte
        const deckGeo = new THREE.BoxGeometry(11.5, 0.5, 29);
        const deckMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.7 }); // Ahşap doku hissi
        const deck = new THREE.Mesh(deckGeo, deckMat);
        deck.position.y = 0.25;
        deck.receiveShadow = true;
        shipGroup.add(deck);

        scene.add(shipGroup);

        // --- FARKLI TİPLERDE KONTEYNERLAR (Gezilebilir Düzen) ---
        const containers = [];
        const containerTypes = [
            { color: 0xcc2222, size: [3, 2, 5] }, // Tehlikeli Madde Kırmızı
            { color: 0x2244cc, size: [4, 2, 3] }, // Standart Kargo Mavi
            { color: 0xccaa22, size: [2.5, 2.5, 4] } // Soğutuculu Sarı
        ];

        const containerPositions = [
            {-3, 1.5, -5}, {3, 1.5, -2}, {-2.5, 1.5, 4}, {3, 1.5, 7}
        ];

        // Güverte üstü siper alınabilir konteyner yerleşimi
        const cData = [
            { x: -3, z: -6, type: 0 },
            { x: 3, z: -3, type: 1 },
            { x: -2, z: 2, type: 2 },
            { x: 2.5, z: 6, type: 0 }
        ];

        cData.forEach(data => {
            const t = containerTypes[data.type];
            const geo = new THREE.BoxGeometry(t.size[0], t.size[1], t.size[2]);
            const mat = new THREE.MeshStandardMaterial({ color: t.color, metalness: 0.5, roughness: 0.3 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(data.x, t.size[1]/2 + 0.5, data.z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            shipGroup.add(mesh);
            containers.push(mesh);
        });

        // --- 3 ADET DOST NPC (Stratejik Siper Alan) ---
        const npcs = [];
        const npcPositions = [
            { x: -4, z: -8 },
            { x: 4, z: 2 },
            { x: 0, z: 9 }
        ];

        npcPositions.forEach((pos, index) => {
            const npcGroup = new THREE.Group();
            
            // Gövde
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32 }); // Askeri yeşil
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.5), bodyMat);
            body.position.y = 0.75;
            npcGroup.add(body);

            // Baş
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.25), new THREE.MeshStandardMaterial({ color: 0xffdbac }));
            head.position.y = 1.6;
            npcGroup.add(head);

            npcGroup.position.set(pos.x, 0.5, pos.z);
            scene.add(npcGroup);
            npcs.push({ mesh: npcGroup, basePos: pos, patrolTimer: index * 50 });
        });

        // --- KONTROL MEKANİZMASI (Sağ/Sol Düzeltmesi) ---
        const keys = { left: false, right: false };
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;   // Sola çekme düzeltildi
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true; // Sağa çekme düzeltildi
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
        });

        // Kamera / Oyuncu Rotasyonu için
        let playerAngle = 0;

        // --- ANIMASYON DÖNGÜSÜ ---
        function animate() {
            requestAnimationFrame(animate);

            // Kontrollerin İşlenmesi (Terslik giderildi)
            if (keys.left) {
                playerAngle += 0.03; // Sola hareket
            }
            if (keys.right) {
                playerAngle -= 0.03; // Sağa hareket
            }

            // Kamerayı oynatıcı açısına göre konumlandır
            camera.position.x = Math.sin(playerAngle) * 28;
            camera.position.z = Math.cos(playerAngle) * 28;
            camera.lookAt(0, 0, 0);

            // Dost NPC'lerin hareketleri (Siper alma / Dolaşma simülasyonu)
            npcs.forEach((npc, idx) => {
                npc.patrolTimer += 0.01;
                npc.mesh.position.x = npc.basePos.x + Math.sin(npc.patrolTimer) * 1.5; // Kolay hedef olmamak için hareketliler
            });

            renderer.render(scene, camera);
        }

        animate();

        // Pencere Boyutu Ayarı
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
